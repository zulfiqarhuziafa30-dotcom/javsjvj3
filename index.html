    <script>
      (function() {
        // Defensive fix for environments where window.fetch is a getter-only property
        try {
          var _rawFetch = window.fetch;
          if (_rawFetch) {
            var _curFetch = _rawFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _curFetch;
              },
              set: function(fn) {
                _curFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              try {
                Object.defineProperty(globalThis, 'fetch', {
                  get: function() { return _curFetch; },
                  set: function(fn) { _curFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              } catch (_) {}
            }
          }
        } catch (e) {
          // Fallback if property is not configurable
        }

        // Global error suppressor for any rogue fetch getter assignments
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('Cannot set property fetch')) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return true;
          }
        });
      })();
    </script>
